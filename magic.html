<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Valentine Magic</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(45deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .magic-container {
      color: #fff;
      z-index: 1;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    p {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    /* Confetti canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="magic-container">
    <h1>You're My One and Only! 💖</h1>
    <p>Let the magic begin...</p>
    <!-- Tenor GIF Embed -->
    <div class="tenor-gif-embed" data-postid="4957516" data-share-method="host" data-aspect-ratio="1.86567" data-width="100%">
      <a href="https://tenor.com/view/party-happy-minions-cheer-hug-gif-4957516">Party Happy GIF</a>
      from <a href="https://tenor.com/search/party-gifs">Party GIFs</a>
    </div> 
    <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
  </div>
  <canvas id="confettiCanvas"></canvas>
  <script>
    // Confetti effect
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    const particles = [];
    const particleCount = 150;
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    function randomColor() {
      const colors = ['#ff0', '#f0f', '#0ff', '#0f0', '#f00', '#00f'];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function Particle() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height - canvas.height;
      this.size = Math.random() * 5 + 2;
      this.speedY = Math.random() * 3 + 2;
      this.color = randomColor();
      this.angle = Math.random() * Math.PI * 2;
      this.rotationSpeed = Math.random() * 0.1 - 0.05;
    }

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        p.angle += p.rotationSpeed;
        if (p.y > canvas.height) {
          p.y = -p.size;
          p.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      requestAnimationFrame(updateParticles);
    }

    updateParticles();
  </script>
</body>
</html>
