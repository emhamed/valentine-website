<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Valentine Magic</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(45deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      /* Use Flexbox to center content vertically and horizontally */
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .magic-container {
      color: #fff;
      z-index: 1;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    p {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    /* Style for the GIF image */
    .magic-gif {
      max-width: 90%;
      height: auto;
      border: 5px solid #fff;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
    /* Confetti canvas style */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="magic-container">
    <h1>You're My One and Only! 💖</h1>
    <p>Let the magic begin...</p>
    <!-- Adding a GIF: Replace "magic.gif" with your GIF file name -->
    <img src="magic.gif" alt="Magical Celebration" class="magic-gif">
  </div>
  <canvas id="confettiCanvas"></canvas>
  <script>
    // Set up the canvas for the confetti effect
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');
    const particles = [];
    const particleCount = 150;
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    // Function to get a random color
    function randomColor() {
      const colors = ['#ff0', '#f0f', '#0ff', '#0f0', '#f00', '#00f'];
      return colors[Math.floor(Math.random() * colors.length)];
    }
    
    // Define a confetti particle
    function Particle() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height - canvas.height;
      this.size = Math.random() * 5 + 2;
      this.speedY = Math.random() * 3 + 2;
      this.color = randomColor();
      this.angle = Math.random() * Math.PI * 2;
      this.rotationSpeed = Math.random() * 0.1 - 0.05;
    }
    
    // Create the particles
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }
    
    // Update and draw the particles
    function updateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        p.angle += p.rotationSpeed;
        if (p.y > canvas.height) {
          p.y = -p.size;
          p.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      });
      requestAnimationFrame(updateParticles);
    }
    
    updateParticles();
  </script>
</body>
</html>
