<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine</title>
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>How was your day today?</h1>
    <div class="options">
      <button onclick="nextQuestion()">Good 😊</button>
      <button onclick="nextQuestion()">Adoption of Good 🥰</button>
      <button onclick="nextQuestion()">I Miss You 😢</button>
    </div>
    <div id="question2" class="hidden">
      <h1>Will you be my Valentine? ❤️</h1>
      <button class="yes-button" onclick="sayYes()">Yes! 💖</button>
      <button class="no-button" onclick="askAgain()">No... 😳</button>
    </div>
  </div>

  <audio id="background-music" autoplay loop>
    <source src="your-music-file.mp3" type="audio/mp3">
  </audio>

  <script>
    function nextQuestion() {
      document.querySelector('.options').style.display = 'none';
      document.getElementById('question2').classList.remove('hidden');
    }
    function sayYes() {
      // Redirect to the magical page when she clicks "Yes!"
      window.location.href = "magic.html";
    }
    function askAgain() {
      alert("Hmm... think again! 😏");
    }
  </script>
</body>
</html>
